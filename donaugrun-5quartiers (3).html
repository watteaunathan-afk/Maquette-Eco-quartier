<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Donaugrün — Maquette 3D · 5 éco-quartiers reliés par le Grünband</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#cfe6f2;
    font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #scene{position:fixed;inset:0}
  canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 54%,rgba(8,26,40,.26) 100%)}

  /* control bar */
  .controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:stretch;padding:0 10px;max-width:96vw}
  .btn{background:rgba(10,26,33,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);color:#eaf3f6;font-family:inherit;font-size:12.5px;letter-spacing:.02em;
    font-weight:500;padding:11px 15px;border-radius:12px;cursor:pointer;white-space:nowrap;
    transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;
    display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:rgba(30,56,72,.85);transform:translateY(-1px)}
  .btn.active{background:#1fb6a6;border-color:#1fb6a6;color:#04201c;box-shadow:0 4px 18px rgba(31,182,166,.45)}
  .btn.icon{padding:11px 12px}
  .btn svg{width:16px;height:16px;stroke-width:1.7;display:block}
  .sep{width:1px;background:rgba(255,255,255,.18);margin:5px 3px;align-self:stretch}

  /* navigation hint (controls only, fades away) */
  #hint{position:fixed;right:16px;bottom:18px;z-index:10;max-width:42vw;text-align:right;
    font-size:11.5px;line-height:1.6;color:rgba(255,255,255,.9);text-shadow:0 1px 5px rgba(0,0,0,.55);
    transition:opacity .8s ease;pointer-events:none}
  #hint b{color:#7fe0c4;font-weight:500}
  #hint.gone{opacity:0}

  /* a tiny re-show button for the hint */
  #helpBtn{position:fixed;left:16px;bottom:18px;z-index:10;width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(10,26,33,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);color:#eaf3f6;font-size:15px;transition:background .18s}
  #helpBtn:hover{background:rgba(30,56,72,.85)}

  #loader{position:fixed;inset:0;background:#08161f;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;z-index:50;transition:opacity .6s ease}
  #loader .ring{width:46px;height:46px;border:3px solid rgba(255,255,255,.15);border-top-color:#1fb6a6;border-radius:50%;animation:spin .9s linear infinite}
  #loader p{color:#8fb0c4;font-size:12.5px;letter-spacing:.05em}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:560px){
    .btn{font-size:11.5px;padding:9px 11px}
    #hint{display:none}
    #helpBtn{display:none}
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="vignette"></div>

  <div class="controls">
    <button class="btn active" id="v-all">Vue d'ensemble</button>
    <button class="btn" id="v-grun">Grünspirale</button>
    <button class="btn" id="v-schwimm">Schwimmquartier</button>
    <button class="btn" id="v-band">Grünband</button>
    <button class="btn" id="v-wald">Waldquartier</button>
    <button class="btn" id="v-krater">Gartenkrater</button>
    <span class="sep"></span>
    <button class="btn" id="v-night">Jour / Nuit</button>
    <button class="btn active" id="v-rotate">Rotation</button>
    <button class="btn icon" id="v-full" title="Plein écran" aria-label="Plein écran">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <button id="helpBtn" title="Aide navigation" aria-label="Aide navigation">?</button>
  <div id="hint">
    Glissez pour pivoter · molette / pincez pour zoomer<br>
    <b>Clic droit</b> ou <b>Maj + glisser</b> · <b>WASD / flèches</b> pour vous déplacer<br>
    <b>E&nbsp;/&nbsp;Q</b> ou <b>Espace</b> pour monter et descendre
  </div>

  <div id="loader"><div class="ring"></div><p>Aménagement des cinq quartiers…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const THREE = window.THREE;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const choice=a=>a[Math.floor(Math.random()*a.length)];

  // ---------- Renderer ----------
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  document.getElementById('scene').appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(46,window.innerWidth/window.innerHeight,0.1,4000);

  const C1=new THREE.Vector3(-70,0,92); // Grünspirale (land)
  const C2=new THREE.Vector3(50,0,0);  // Schwimmquartier (water)

  // ---------- Sky + environment (IBL for real reflections) ----------
  function skyTex(stops){const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,256);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,2,256);
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
  const skyDay=skyTex([[0,'#86bfe8'],[0.5,'#bcd9ee'],[1,'#edf2ea']]);
  const skyNight=skyTex([[0,'#060c20'],[0.5,'#101a3a'],[1,'#1f2d50']]);
  scene.background=skyDay;
  scene.fog=new THREE.Fog(0xe6eee6,150,460);

  function envEquirect(stops){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,256);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,512,256);
    // soft sun disc for specular highlight
    const sg=x.createRadialGradient(360,70,0,360,70,60);sg.addColorStop(0,'rgba(255,245,220,0.95)');sg.addColorStop(1,'rgba(255,245,220,0)');
    x.fillStyle=sg;x.beginPath();x.arc(360,70,60,0,7);x.fill();
    const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;return t;}
  const pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
  const envDay=pmrem.fromEquirectangular(envEquirect([[0,'#9fc8ea'],[0.48,'#d3e3ee'],[0.52,'#3f7186'],[1,'#1d4a5c']])).texture;
  const envNight=pmrem.fromEquirectangular(envEquirect([[0,'#0a1430'],[0.48,'#162446'],[0.52,'#0d2230'],[1,'#06141c']])).texture;
  scene.environment=envDay;

  // ---------- Lights ----------
  const hemi=new THREE.HemisphereLight(0xdfeeff,0x55604f,0.8); scene.add(hemi);
  const ambient=new THREE.AmbientLight(0xffffff,0.22); scene.add(ambient);
  const sun=new THREE.DirectionalLight(0xffe7bf,2.6);
  sun.position.set(60,78,54); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=1; sun.shadow.camera.far=420;
  sun.shadow.camera.left=-140;sun.shadow.camera.right=140;sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;
  sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.9; scene.add(sun);
  const fill=new THREE.DirectionalLight(0xbcd6ff,0.45); fill.position.set(-50,38,-44); scene.add(fill);

  // ---------- Texture helpers ----------
  function planks(tone,line){const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    x.fillStyle=tone;x.fillRect(0,0,s,s);
    for(let i=0;i<s;i+=20){x.fillStyle='rgba(0,0,0,0.09)';x.fillRect(0,i,s,2);x.fillStyle='rgba(255,255,255,0.045)';x.fillRect(0,i+2,s,1);}
    for(let i=0;i<220;i++){x.fillStyle=`rgba(${line},${0.05+Math.random()*0.05})`;x.fillRect(Math.random()*s,Math.random()*s,rand(6,18),1);}
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;}
  function grassTex(){const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    x.fillStyle='#6fa64f';x.fillRect(0,0,s,s);
    for(let i=0;i<3000;i++){x.fillStyle=Math.random()<0.5?'rgba(84,128,60,0.5)':'rgba(150,190,118,0.45)';x.fillRect(Math.random()*s,Math.random()*s,rand(1,3),rand(1,3));}
    for(let i=0;i<14;i++){x.fillStyle='rgba(104,146,80,0.2)';x.beginPath();x.arc(Math.random()*s,Math.random()*s,rand(10,26),0,7);x.fill();}
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(50,50);t.encoding=THREE.sRGBEncoding;return t;}
  function pavingTex(){const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    x.fillStyle='#cdc7b8';x.fillRect(0,0,s,s);const n=4,t=s/n;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){x.fillStyle=`rgba(${190+Math.random()*25|0},${184+Math.random()*22|0},${168+Math.random()*20|0},1)`;x.fillRect(i*t+1.5,j*t+1.5,t-3,t-3);}
    x.strokeStyle='rgba(120,114,100,0.5)';x.lineWidth=2;
    for(let i=0;i<=n;i++){x.beginPath();x.moveTo(i*t,0);x.lineTo(i*t,s);x.stroke();x.beginPath();x.moveTo(0,i*t);x.lineTo(s,i*t);x.stroke();}
    const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.encoding=THREE.sRGBEncoding;return tex;}
  function pvTexF(){const w=128,h=128,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.fillStyle='#1c3150';x.fillRect(0,0,w,h);const n=4,t=w/n;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){const g=x.createLinearGradient(i*t,j*t,i*t+t,j*t+t);g.addColorStop(0,'#2a4670');g.addColorStop(1,'#16273f');x.fillStyle=g;x.fillRect(i*t+1,j*t+1,t-2,t-2);}
    x.strokeStyle='rgba(150,175,210,0.28)';x.lineWidth=1.5;
    for(let i=0;i<=n;i++){x.beginPath();x.moveTo(i*t,0);x.lineTo(i*t,h);x.stroke();x.beginPath();x.moveTo(0,i*t);x.lineTo(w,i*t);x.stroke();}
    const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.encoding=THREE.sRGBEncoding;return tex;}
  function greenWallTex(){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    x.fillStyle='#3f7a3a';x.fillRect(0,0,s,s);
    for(let i=0;i<1400;i++){x.fillStyle=['#356b32','#4f9148','#5fa257','#2f6437','#6cae5b'][Math.floor(Math.random()*5)];x.beginPath();x.arc(Math.random()*s,Math.random()*s,rand(2,5),0,7);x.fill();}
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;}
  function cloudTexF(){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    [[64,70,40],[40,72,26],[88,72,28],[56,56,30],[78,58,24]].forEach(b=>{const g=x.createRadialGradient(b[0],b[1],0,b[0],b[1],b[2]);g.addColorStop(0,'rgba(255,255,255,0.92)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(b[0],b[1],b[2],0,7);x.fill();});
    return new THREE.CanvasTexture(c);}

  // ---------- Shared registries ----------
  const windowMats=[],lampMats=[],boatLightMats=[],floaters=[],pointLights=[];

  // ---------- Facade material pool (shared, harmonised) ----------
  const TIMBER=['#cdb48a','#d6ccb8','#c2a878','#cbb49a','#c8b890'];
  function makeFacade(tone,cols,rows){
    const W=256,H=512,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle=tone;x.fillRect(0,0,W,H);
    for(let i=0;i<H;i+=34){x.fillStyle='rgba(0,0,0,0.04)';x.fillRect(0,i,W,2);}
    const ec=document.createElement('canvas');ec.width=W;ec.height=H;const ex=ec.getContext('2d');ex.fillStyle='#000';ex.fillRect(0,0,W,H);
    const mx=W*0.1,gw=(W-mx*2)/cols,cellH=H/rows,ww=gw*0.64,wh=cellH*0.58;
    for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++){const wx=mx+cc*gw+(gw-ww)/2,wy=r*cellH+(cellH-wh)/2+5;
      const g=x.createLinearGradient(wx,wy,wx,wy+wh);g.addColorStop(0,'#dceef6');g.addColorStop(1,'#a3c6d8');
      x.fillStyle=g;x.fillRect(wx,wy,ww,wh);
      x.strokeStyle='rgba(70,58,46,0.55)';x.lineWidth=2.5;x.strokeRect(wx,wy,ww,wh);
      x.fillStyle='rgba(70,58,46,0.5)';x.fillRect(wx+ww/2-1,wy,2,wh);
      ex.fillStyle=(Math.random()<0.46)?'#ffd58a':'#0c0c0c';ex.fillRect(wx,wy,ww,wh);}
    const map=new THREE.CanvasTexture(c);map.encoding=THREE.sRGBEncoding;
    const emap=new THREE.CanvasTexture(ec);emap.encoding=THREE.sRGBEncoding;
    const m=new THREE.MeshStandardMaterial({map,emissive:0xffffff,emissiveMap:emap,emissiveIntensity:0,roughness:0.8,metalness:0.04});
    windowMats.push(m);return m;}
  const facadePool=[makeFacade(TIMBER[0],4,7),makeFacade(TIMBER[1],3,6),makeFacade(TIMBER[2],4,9),makeFacade(TIMBER[3],3,5),makeFacade(TIMBER[4],5,8)];
  const facTall=facadePool[2], facMed=facadePool[1], facLow=facadePool[3];

  // ---------- Shared materials ----------
  const deckTex=planks('#9a6b3f','110,72,38');
  const deckMat=new THREE.MeshStandardMaterial({map:deckTex,roughness:0.85});
  const floatMat=new THREE.MeshStandardMaterial({color:0x39454e,roughness:0.65,metalness:0.25});
  const trunkMat=new THREE.MeshStandardMaterial({color:0x6e4a2e,roughness:0.95});
  const foliageMats=[0x5a9450,0x6aa85a,0x4f8746,0x76b35f].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:0.9}));
  const coniferMats=[0x2f6437,0x3a7044].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:0.9}));
  const roofGreenMat=new THREE.MeshStandardMaterial({color:0x5fa257,roughness:0.85});
  const steelMat=new THREE.MeshStandardMaterial({color:0xc2c9d0,roughness:0.35,metalness:0.7});
  const capMat=new THREE.MeshStandardMaterial({color:0xece7dc,roughness:0.9});
  const stoneMat=new THREE.MeshStandardMaterial({color:0xc9c3b4,roughness:0.95});
  const pvMat=new THREE.MeshStandardMaterial({map:pvTexF(),roughness:0.18,metalness:0.8});
  const glassRailMat=new THREE.MeshStandardMaterial({color:0xaccfdd,transparent:true,opacity:0.28,roughness:0.05,metalness:0.3});
  const greenWallMat=new THREE.MeshStandardMaterial({map:greenWallTex(),roughness:0.92});
  const flowerMats=[0xf2a6bd,0xf6d98a,0xc6a6e0].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:0.85}));
  const hedgeMat=new THREE.MeshStandardMaterial({color:0x4f8f44,roughness:0.9});
  const foamMat=new THREE.MeshBasicMaterial({color:0xdff1f4,transparent:true,opacity:0.2});
  const shrubGeo=new THREE.IcosahedronGeometry(0.6,0);
  const personMats=[0xc94f4f,0x4f6dc9,0x4faf7a,0xd8b24a,0x9a5fc9,0xd87f3a].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:0.8}));
  const skinMat=new THREE.MeshStandardMaterial({color:0xe8b48a,roughness:0.8});

  function clump(scale,mat){const g=new THREE.Group();const n=3+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.4,0.7)*scale,1),mat||choice(foliageMats));
      m.position.set(rand(-0.4,0.4)*scale,rand(0,0.6)*scale,rand(-0.4,0.4)*scale);m.castShadow=true;g.add(m);}return g;}
  function makeTree(scale){const g=new THREE.Group();const th=rand(1.5,2.3)*scale;
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.1*scale,0.16*scale,th,6),trunkMat);tr.position.y=th/2;tr.castShadow=true;g.add(tr);
    if(Math.random()<0.82){const baseR=rand(0.9,1.35)*scale,mat=choice(foliageMats);
      [[0,th+baseR*0.6,0,baseR],[rand(-0.4,0.4),th+baseR*1.2,rand(-0.4,0.4),baseR*0.75],[0,th+baseR*1.7,0,baseR*0.5]].forEach(b=>{
        const m=new THREE.Mesh(new THREE.IcosahedronGeometry(b[3],1),mat);m.position.set(b[0],b[1],b[2]);m.castShadow=true;g.add(m);});}
    else{const mat=choice(coniferMats);for(let k=0;k<3;k++){const r=(1.2-k*0.32)*scale,hC=1.6*scale;const c=new THREE.Mesh(new THREE.ConeGeometry(r,hC,8),mat);c.position.y=th+k*hC*0.55;c.castShadow=true;g.add(c);}}
    return g;}
  function flowers(group,cx,cz,r,y,count){for(let i=0;i<count;i++){const a=Math.random()*7,rr=Math.sqrt(Math.random())*r;
    const f=new THREE.Mesh(new THREE.SphereGeometry(rand(0.07,0.12),6,6),choice(flowerMats));f.position.set(cx+Math.cos(a)*rr,(y||0)+0.14,cz+Math.sin(a)*rr);group.add(f);}}
  function makePerson(){const g=new THREE.Group();const col=choice(personMats);
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,0.85,7),col);body.position.y=0.62;body.castShadow=true;g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.15,10,10),skinMat);head.position.y=1.2;head.castShadow=true;g.add(head);
    const legs=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.55,6),new THREE.MeshStandardMaterial({color:0x33384a,roughness:0.9}));legs.position.y=0.27;g.add(legs);
    g.rotation.y=rand(0,7);return g;}
  function foamRing(r){const m=new THREE.Mesh(new THREE.RingGeometry(r,r+0.5,28),foamMat);m.rotation.x=-Math.PI/2;m.position.y=0.02;return m;}

  // ---------- Building helper (shared) ----------
  function makeBuilding(kind,ang){
    const grp=new THREE.Group();
    function box(bw,bd,bh,y0,fac){
      const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),[fac,fac,capMat,capMat,fac,fac]);
      m.position.y=y0+bh/2;m.castShadow=true;m.receiveShadow=true;grp.add(m);}
    function greenAccent(bw,bd,bh){ // light vertical-garden strips
      [[0,bd/2+0.05,0],[0,-bd/2-0.05,Math.PI]].forEach(f=>{const t=greenWallMat.clone();
        const panel=new THREE.Mesh(new THREE.PlaneGeometry(bw*0.22,bh*0.86),greenWallMat);
        panel.position.set(rand(-bw*0.25,bw*0.25),bh*0.5,f[1]);panel.rotation.y=f[2];panel.receiveShadow=true;grp.add(panel);});}
    function greenRoof(bw,bd,y){const slab=new THREE.Mesh(new THREE.BoxGeometry(bw*1.05,0.4,bd*1.05),roofGreenMat);
      slab.position.y=y+0.2;slab.castShadow=true;slab.receiveShadow=true;grp.add(slab);
      for(let s=0;s<3;s++){const sh=clump(rand(0.6,0.95));sh.position.set(rand(-bw*0.3,bw*0.3),y+0.4,rand(-bd*0.3,bd*0.3));grp.add(sh);}
      flowers(grp,0,0,Math.min(bw,bd)*0.32,y+0.4,5);
      const pv=new THREE.Mesh(new THREE.BoxGeometry(bw*0.42,0.1,bd*0.3),pvMat);pv.position.set(bw*0.16,y+0.52,-bd*0.16);pv.rotation.x=-0.2;pv.castShadow=true;grp.add(pv);}
    function balc(bw,bd,bh){const floors=Math.floor((bh-2.8)/3.1);
      for(let f=1;f<=floors;f++){const y=2.8+f*3.1;if(y>bh-1)break;[1,-1].forEach(s=>{
        const slab=new THREE.Mesh(new THREE.BoxGeometry(bw*0.78,0.14,1.0),capMat);slab.position.set(0,y,s*(bd/2+0.5));slab.castShadow=true;grp.add(slab);
        const rail=new THREE.Mesh(new THREE.BoxGeometry(bw*0.78,0.7,0.04),glassRailMat);rail.position.set(0,y+0.4,s*(bd/2+0.98));grp.add(rail);

  // ---------- Ground (forest floor) ----------

  // ---------- Pond (wetland) ----------
  const PX=9,PZ=-6,PR=6.2;
  function makeWater(radius,rings,radial){const pos=[],idx=[];pos.push(0,0,0);
    for(let r=1;r<=rings;r++){const rr=radius*r/rings;for(let a=0;a<radial;a++){const ang=a/radial*Math.PI*2;pos.push(Math.cos(ang)*rr,Math.sin(ang)*rr,0);}}
    const id=(r,a)=>1+(r-1)*radial+((a%radial+radial)%radial);
    for(let a=0;a<radial;a++)idx.push(0,id(1,a),id(1,a+1));
    for(let r=1;r<rings;r++)for(let a=0;a<radial;a++){const a0=id(r,a),a1=id(r,a+1),b0=id(r+1,a),b1=id(r+1,a+1);idx.push(a0,b0,a1,a1,b0,b1);}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;}

  // ---------- Houses on stilts + walkways ----------
  const H=6.8, NH=8, RING=25;
  const houses=[]; // {x,z,half}
  function makeHouse(rotY){
    const grp=new THREE.Group();const half=3.9;const fac=makeFacade(choice(TIMBER),3,3);
    // stilts
    for(const sx of [-1,1])for(const sz of [-1,1]){const st=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.26,H,8),deckDarkMat);st.position.set(sx*(half-0.5),H/2,sz*(half-0.5));st.castShadow=true;grp.add(st);}
    const stc=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.3,H,8),deckDarkMat);stc.position.set(0,H/2,0);grp.add(stc);
    // deck
    const deck=new THREE.Mesh(new THREE.BoxGeometry(half*2,0.3,half*2),deckMat);deck.position.y=H;deck.castShadow=true;deck.receiveShadow=true;grp.add(deck);
    // deck railing
    const rp=[];const hw=half-0.1;[[-hw,-hw],[hw,-hw],[hw,hw],[-hw,hw],[-hw,-hw]].forEach(p=>rp.push(new THREE.Vector3(p[0],H+0.6,p[1])));
    grp.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rp),40,0.04,5,false),ropeMat));
    // house volume
    const hh=rand(4.6,5.6),hw2=half*1.5;
    const body=new THREE.Mesh(new THREE.BoxGeometry(5.4,hh,5.4),[fac,fac,capMat,capMat,fac,fac]);body.position.set(-0.4,H+0.15+hh/2,-0.4);body.castShadow=true;body.receiveShadow=true;grp.add(body);
    // big glazing facing forest (+x +z corner deck)
    const glz=new THREE.Mesh(new THREE.BoxGeometry(0.2,hh*0.8,4.4),glassMat);glz.position.set(-0.4+2.7,H+0.3+hh/2,-0.4);grp.add(glz);
    // green roof + PV + skylight
    const roof=new THREE.Mesh(new THREE.BoxGeometry(5.8,0.4,5.8),roofGreenMat);roof.position.set(-0.4,H+0.15+hh+0.2,-0.4);roof.castShadow=true;grp.add(roof);
    for(let s=0;s<3;s++){const sh=new THREE.Mesh(shrubGeo,choice(foliageMats));sh.position.set(-0.4+rand(-2,2),H+0.15+hh+0.5,-0.4+rand(-2,2));sh.scale.setScalar(rand(0.7,1.1));sh.castShadow=true;grp.add(sh);}
    const pv=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.1,1.8),pvMat);pv.position.set(-0.4-1,H+0.15+hh+0.5,-0.4+1.2);pv.rotation.x=-0.25;grp.add(pv);
    // deck planters + a potted tree + person
    for(let i=0;i<2;i++){const pb=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.3,0.5),soilMat);pb.position.set(rand(-2,2),H+0.3,half-0.4);grp.add(pb);for(let k=0;k<4;k++){const v=new THREE.Mesh(shrubGeo,choice(foliageMats));v.position.set(pb.position.x+rand(-0.9,0.9),H+0.55,half-0.4);v.scale.set(0.3,0.5,0.3);grp.add(v);}}
    const potTree=makeTree(0.5);potTree.position.set(half-1,H+0.3,-(half-1));grp.add(potTree);
    const pers=makePerson();pers.position.set(rand(-2,2),H+0.3,rand(-1,2));grp.add(pers);
    // ladder/stair down
    const stair=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.2,H*1.25),deckDarkMat);stair.position.set(half+0.6,H/2,-half-0.6);stair.rotation.x=Math.atan2(H,H*0.7);grp.add(stair);
    grp.rotation.y=rotY;
    return {grp,half};
  }
  for(let i=0;i<NH;i++){const ang=i/NH*Math.PI*2 + 0.2;const x=Math.cos(ang)*RING,z=Math.sin(ang)*RING;
    const {grp,half}=makeHouse(Math.atan2(z,x)+Math.PI);grp.position.set(x,0,z);wald.add(grp);

  // central hub deck (elevated)
  const hub={x:0,z:3,r:5};
  (function(){const grp=new THREE.Group();
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const st=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.3,H,8),deckDarkMat);st.position.set(Math.cos(a)*(hub.r-0.6),H/2,Math.sin(a)*(hub.r-0.6));st.castShadow=true;grp.add(st);}
    const deck=new THREE.Mesh(new THREE.CylinderGeometry(hub.r,hub.r,0.34,8),deckMat);deck.position.y=H;deck.castShadow=true;deck.receiveShadow=true;grp.add(deck);
    // roof on posts (shelter)
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2;const c=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,3.4,7),deckDarkMat);c.position.set(Math.cos(a)*(hub.r-0.8),H+1.9,Math.sin(a)*(hub.r-0.8));grp.add(c);}
    const roof=new THREE.Mesh(new THREE.ConeGeometry(hub.r+0.8,2.2,8),roofGreenMat);roof.position.y=H+4.4;roof.castShadow=true;grp.add(roof);
    // railing
    const rp=[];for(let i=0;i<=8;i++){const a=i/8*Math.PI*2;rp.push(new THREE.Vector3(Math.cos(a)*(hub.r-0.15),H+0.6,Math.sin(a)*(hub.r-0.15)));}
    grp.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rp,true),60,0.04,5,true),ropeMat));
    for(let i=0;i<4;i++){const p=makePerson();p.position.set(rand(-3,3),H+0.32,rand(-3,3));grp.add(p);}
    // spiral-ish stair down (a few flights)
    const stair=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.2,H*1.3),deckDarkMat);stair.position.set(hub.r+0.4,H/2,-1);stair.rotation.x=Math.atan2(H,H*0.7);grp.add(stair);
    grp.position.set(hub.x,0,hub.z);wald.add(grp);
  })();

  // ---------- Canopy walkways (suspended, sagging) ----------
  function plankPath(A,B,width){width=width||1.8;const steps=16,pts=[];
    const flat=new THREE.Vector3(B.x-A.x,0,B.z-A.z);const len=flat.length();flat.normalize();const perp=new THREE.Vector3(-flat.z,0,flat.x);

  function updateCamera(){

      target.x+camRadius*Math.sin(camPhi)*Math.cos(camTheta),
      target.y+camRadius*Math.cos(camPhi),
      target.z+camRadius*Math.sin(camPhi)*Math.sin(camTheta));

  function clampTarget(){

  bKrater.addEventListener('click',()=>focus('krater'));

  function setNight(on){
    isNight=on; bNight.classList.toggle('active',on);
    if(on){ scene.background=skyNight; scene.environment=envNight; scene.fog.color.set(0x1f2d50);
      sun.intensity=0.4; sun.color.set(0x8aa0d0); fill.intensity=0.18; hemi.intensity=0.36; hemi.color.set(0x32507a); ambient.intensity=0.36; ambient.color.set(0x24345c);
      waterMat.color.set(0x143444); farWater.material.color.set(0x102b38);
      windowMats.forEach(m=>m.emissiveIntensity=2.1); lampMats.forEach(m=>m.emissiveIntensity=3.0); boatLightMats.forEach(m=>m.emissiveIntensity=2.6);
      pointLights.forEach(p=>p.l.intensity=p.on); clouds.forEach(c=>c.material.opacity*=0.35);
      nightHooks.forEach(fn=>fn(true));
    } else { scene.background=skyDay; scene.environment=envDay; scene.fog.color.set(0xe6eee6);
      sun.intensity=2.6; sun.color.set(0xffe7bf); fill.intensity=0.45; hemi.intensity=0.8; hemi.color.set(0xdfeeff); ambient.intensity=0.22; ambient.color.set(0xffffff);
      waterMat.color.set(0x2c6076); farWater.material.color.set(0x295a6f);
      windowMats.forEach(m=>m.emissiveIntensity=0); lampMats.forEach(m=>m.emissiveIntensity=0); boatLightMats.forEach(m=>m.emissiveIntensity=0);
      pointLights.forEach(p=>p.l.intensity=0); clouds.forEach(c=>c.material.opacity=Math.min(0.72,c.material.opacity/0.35)); nightHooks.forEach(fn=>fn(false)); }
  }
  bNight.addEventListener('click',()=>setNight(!isNight));

  bRot.addEventListener('click',()=>{ autoRotate=!autoRotate; bRot.classList.toggle('active',autoRotate); });

  // fullscreen (whole page)
  function toggleFullscreen(){
    const root=document.documentElement;
    const fsEl=document.fullscreenElement||document.webkitFullscreenElement;
    if(!fsEl){ (root.requestFullscreen||root.webkitRequestFullscreen||function(){}).call(root); }
    else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
  }
  bFull.addEventListener('click',toggleFullscreen);

  // navigation hint fade + re-show
  const hint=$('hint'), helpBtn=$('helpBtn');
  let hintTimer=setTimeout(()=>hint.classList.add('gone'),7000);
  helpBtn.addEventListener('click',()=>{ clearTimeout(hintTimer); hint.classList.remove('gone'); hintTimer=setTimeout(()=>hint.classList.add('gone'),7000); });

  // resize (fullscreen, window-driven)
  function resize(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }
  window.addEventListener('resize',resize);
  document.addEventListener('fullscreenchange',()=>setTimeout(resize,80));
  document.addEventListener('webkitfullscreenchange',()=>setTimeout(resize,80));

  // ============================================================
  //  ANIMATE
  // ============================================================
  let first=true, clock=0; const wp=waterGeo.attributes.position;
  function animate(){
    requestAnimationFrame(animate); clock+=0.016;
    for(let i=0;i<wp.count;i++){const bx=waterBase[i*3],by=waterBase[i*3+1];wp.array[i*3+2]=Math.sin(clock*0.8+bx*0.18)*0.09+Math.cos(clock*0.62+by*0.22)*0.09;}
    wp.needsUpdate=true; waterGeo.computeVertexNormals();
    floaters.forEach(f=>{f.grp.position.y=f.baseY+Math.sin(clock*1.0+f.phase)*f.amp;if(f.rotAmp)f.grp.rotation.z=Math.sin(clock*0.7+f.phase)*f.rotAmp;});
    boats.forEach(b=>{b.a+=b.spd*0.016*4;b.grp.position.set(Math.cos(b.a)*b.r,Math.sin(clock*1.2+b.phase)*0.05,Math.sin(b.a)*b.r);b.grp.rotation.y=-b.a+(b.spd>0?Math.PI/2:-Math.PI/2);});
    clouds.forEach(c=>{c.position.x+=0.018;if(c.position.x>210)c.position.x=-190;});
    birds.forEach(b=>{b.a+=b.spd*0.016*4;b.grp.position.set(b.cx+Math.cos(b.a)*b.r,b.grp.position.y+Math.sin(clock*2+b.phase)*0.02,b.cz+Math.sin(b.a)*b.r);b.grp.rotation.y=-b.a+Math.PI/2;});
    if(bandTram){ const s=bandTramState; if(s.stopT>0){ s.stopT-=0.016; }
      else { s.x+=s.dir*s.speed*0.016;
        if(Math.abs(s.x)<0.4 && Math.abs(bandTram.position.x)>=0.4) s.stopT=2.2;
        if(s.x>52){s.x=52;s.dir=-1;} if(s.x<-52){s.x=-52;s.dir=1;} }
      bandTram.position.x=s.x; }
    if(waldUpdate) waldUpdate(0.016, clock, isNight);
    if(kraterBasin) kraterBasin.scale.set(1+Math.sin(clock*1.4)*0.004,1+Math.cos(clock*1.2)*0.004,1);
    const navMove=applyKeys();
    if(autoRotate&&!dragging&&!panning&&!navMove){ camTheta+=0.0011; updateCamera(); }
    renderer.render(scene,camera);
    if(first){first=false;const l=document.getElementById('loader');l.style.opacity='0';setTimeout(()=>l.style.display='none',600);}
  }
  animate();
})();
</script>
</body>
</html>
